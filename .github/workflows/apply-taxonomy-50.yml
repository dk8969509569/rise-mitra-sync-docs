name: Apply 50 Canonical Taxonomy to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-50-taxonomy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pre-main Branch
        uses: actions/checkout@v4
        with:
          ref: pre-main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Taxonomy Injection Engine
        run: node scripts/update-taxonomy-50.js

      - name: Commit & Push All 50 Taxonomy Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/category-*/taxonomy.json
          git commit -m "fix(taxonomy): align all 50 categories with official Google Play Store standards & 150 sub-wings" || echo "No changes to commit"
          git push origin pre-main
