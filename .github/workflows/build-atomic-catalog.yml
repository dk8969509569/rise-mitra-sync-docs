name: Build and Commit Atomic Catalog (01-50)

on:
  workflow_dispatch:
    inputs:
      owner_approval:
        description: 'Type APPROVE_CATALOG_COMMIT to authorize committing generated catalog to pre-main'
        required: true
        default: 'DRY_RUN_DIFF_ONLY'
        type: string
      diff_reviewed:
        description: 'Confirm generated-file diff and 50-category IDs have been reviewed'
        required: true
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/build-atomic-catalog.yml'

# ZEL SAFETY CORRECTION:
# Default runs in read-only diff/validation mode; commit/push executes only with explicit Owner approval.
permissions:
  contents: write

concurrency:
  group: rm-build-atomic-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-categories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate Pre-Generation Canonical 50 Categories & Taxonomy
        run: |
          node -e '
            const fs = require("fs");
            const taxonomy = JSON.parse(fs.readFileSync("public/data/taxonomy.json", "utf8"));
            const cats = Array.isArray(taxonomy) ? taxonomy : (taxonomy.categories || []);
            if (cats.length !== 50) {
              console.error("FAIL_CLOSED: Expected 50 canonical categories in taxonomy.json, found:", cats.length);
              process.exit(1);
            }
            for (let i = 1; i <= 50; i++) {
              const id = String(i).padStart(2, "0");
              const p = `public/js/universal-catalog/categories/cat-${id}.js`;
              if (!fs.existsSync(p) || fs.statSync(p).size === 0) {
                console.error("FAIL_CLOSED: Missing or empty existing atomic category file:", p);
                process.exit(1);
              }
            }
            console.log("PASS: All 50 existing atomic category files and taxonomy verified before generation.");
          '

      - name: Run Atomic Catalog Generator
        run: node scripts/generate-atomic-catalog.js

      - name: Validate Generated Atomic Categories (01-50) & Inspect Diff
        run: |
          node -e '
            const fs = require("fs");
            for (let i = 1; i <= 50; i++) {
              const id = String(i).padStart(2, "0");
              const p = `public/js/universal-catalog/categories/cat-${id}.js`;
              if (!fs.existsSync(p) || fs.statSync(p).size === 0) {
                console.error("FAIL_CLOSED: Generated atomic category missing or empty:", p);
                process.exit(1);
              }
            }
            console.log("PASS: All 50 generated atomic category modules (cat-01 to cat-50) verified.");
          '
          git status --short public/js/universal-catalog/categories/
          git diff --stat public/js/universal-catalog/categories/

      - name: Restore Working Tree When Commit Is Not Explicitly Authorized
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.owner_approval != 'APPROVE_CATALOG_COMMIT' ||
          github.event.inputs.diff_reviewed != 'true'
        run: |
          git checkout -- public/js/universal-catalog/categories/
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "FAIL_CLOSED: Working tree was not cleanly restored after dry-run catalog validation."
            git status --short --untracked-files=no
            exit 1
          fi
          echo "PASS: Dry-run diff review completed; unauthorized catalog commit prevented and working tree restored."

      - name: Commit and Push Atomic Categories
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/pre-main' &&
          github.event.inputs.owner_approval == 'APPROVE_CATALOG_COMMIT' &&
          github.event.inputs.diff_reviewed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/js/universal-catalog/categories/
          git commit -m "feat(catalog): auto-generate atomic categories 01-50 conforming to Play Store canonical specs" || echo "No changes to commit"
          git push origin pre-main

      - name: Record Atomic Catalog Governance Evidence
        if: always()
        run: |
          {
            echo "### Rise Mitra Atomic Catalog (01-50) Build & Diff Gate Evidence"
            echo "- **Commit SHA:** \`${GITHUB_SHA}\`"
            echo "- **Ref / Branch:** \`${GITHUB_REF}\`"
            echo "- **Event:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Run ID:** \`${GITHUB_RUN_ID}\`"
            echo "- **50-Category Pre & Post Validation (\`cat-01.js\` to \`cat-50.js\`):** VERIFIED"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.owner_approval }}" = "APPROVE_CATALOG_COMMIT" ] && [ "${{ github.event.inputs.diff_reviewed }}" = "true" ] && [ "${GITHUB_REF}" = "refs/heads/pre-main" ]; then
              echo "- **Execution Mode:** AUTHORIZED_PRE_MAIN_COMMIT"
            else
              echo "- **Execution Mode:** DRY_RUN_DIFF_VALIDATION_ONLY (Unauthorized auto-commit blocked)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
