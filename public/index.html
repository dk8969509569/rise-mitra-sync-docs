    const RM_GAMES_DATA = [

      { id: 'g35', name: 'रोमांचक यात्रा (Adventure)', icon: '🏔️' },
      { id: 'g36', name: 'गेंद टप्पा (Arcade)', icon: '🕹️' },

      { id: 'g39', name: 'लकी चक्र (Casino Points)', icon: '🎡' },

      { id: 'g44', name: 'बैलगाड़ी रेस (Racing)', icon: '🏁' },
      { id: 'g45', name: 'गाँव का प्रधान (Role Playing)', icon: '👑' },
      { id: 'g46', name: 'खेत सिमुलेटर (Simulation)', icon: '🌾' },
      { id: 'g47', name: 'गली क्रिकेट (Sports)', icon: '🏏' },
      { id: 'g48', name: 'चाणक्य नीति (Strategy)', icon: '♟️' },
      { id: 'g49', name: 'देसी ट्रिविया व तथ्य (Trivia)', icon: '💡' },
      { id: 'g50', name: 'शब्द पहेली व कोश (Word)', icon: '📝' }
    ];

    const C16_CHILDREN = [
      { id: '16-1', name: 'मिस्त्री व गृह मरम्मत', icon: '🔧', badge: 'जल्द उपलब्ध' },
      { id: '16-2', name: 'किराया बहीखाता (Rental Ledger)', icon: '🏠', badge: 'सक्रिय लेज़र', action: 'launch' },
      { id: '16-3', name: 'कमरा व फ्लैट लिस्टिंग', icon: '🏢', badge: 'जल्द उपलब्ध' }
    ];

    let deferredPrompt = null;
    const banner = document.getElementById('playStoreInstallBanner');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW:', err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (banner && !window.matchMedia('(display-mode: standalone)').matches) {
        banner.style.display = 'block';
      }
    });

    async function triggerPWAInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted' && banner) banner.style.display = 'none';
        deferredPrompt = null;
      }
    }

    function dismissPlayBanner() {
      if (banner) banner.style.display = 'none';
    }

    window.addEventListener('appinstalled', () => {
      if (banner) banner.style.display = 'none';
      deferredPrompt = null;
    });

    if (window.matchMedia('(display-mode: standalone)').matches) {
      if (banner) banner.style.display = 'none';
    }

    // ==============================================================
    // GUARANTEED DOM RENDER ENGINE
    // ==============================================================
    function renderCatalogItems() {
      const t1 = document.getElementById('tier1-list');
      const t2 = document.getElementById('tier2-list');

      if (t1 && (!t1.dataset.rendered || t1.innerHTML.includes('लोड हो रहा'))) {
        t1.innerHTML = RM_SERVICES_DATA.map(item => `
          <div data-cat-id="${item.id}" class="rounded-xl bg-slate-900/90 border border-slate-800 transition-all overflow-hidden mb-2">
            <div onclick="handleCategoryClick('${item.id}', this)" class="flex items-center justify-between p-3 cursor-pointer hover:border-emerald-500/50 active:scale-[0.98] transition-transform">
              <div class="flex items-center space-x-3">
                <span class="text-xl">${item.icon}</span>
                <span class="text-xs font-bold text-slate-200">${item.name}</span>
              </div>
              <div class="flex items-center space-x-1.5">
                ${item.hasChildren ? '<span class="text-[10px] text-emerald-400 font-bold bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-800/40">3 सेवाएं</span>' : ''}
                <span class="text-xs text-slate-400 font-bold">${item.hasChildren ? '▼' : 'खोलें ›'}</span>
              </div>
            </div>
            ${item.id === 'c16' ? `
              <div id="sub-c16" class="p-2 pt-0 space-y-1.5 border-t border-slate-800/60 bg-slate-950/60" style="display: block;">
                ${C16_CHILDREN.map(ch => `
                  <div onclick="handleLaunchCategory('c16', '${ch.id}')" class="flex items-center justify-between p-2.5 rounded-lg bg-slate-900 border border-slate-800 hover:border-emerald-500/60 cursor-pointer active:scale-[0.98]">
                    <div class="flex items-center space-x-2">
                      <span>${ch.icon}</span>
                      <span class="text-xs text-slate-300 font-medium">${ch.name}</span>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded ${ch.action === 'launch' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400'}">${ch.badge}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `).join('');
        t1.dataset.rendered = "true";
      }

      if (t2 && (!t2.dataset.rendered || t2.innerHTML.includes('लोड हो रहे'))) {
        t2.innerHTML = RM_GAMES_DATA.map(item => `
          <div data-cat-id="${item.id}" class="flex items-center justify-between p-3 rounded-xl bg-slate-900/90 border border-slate-800 hover:border-cyan-500/50 active:scale-[0.98] transition-transform cursor-pointer mb-2" onclick="alert('${item.name} गेम जल्द शुरू होगा')">
            <div class="flex items-center space-x-3">
              <span class="text-xl">${item.icon}</span>
              <span class="text-xs font-bold text-slate-200">${item.name}</span>
            </div>
            <span class="text-xs text-cyan-400 font-semibold px-2 py-1 bg-cyan-950/60 rounded-lg border border-cyan-800/40">खेलें ›</span>
          </div>
        `).join('');
        t2.dataset.rendered = "true";
      }

      syncCategoryVisibilityFromOwner();
    }

    // ==============================================================
    // OWNER CONSOLE VISIBILITY SYNC (SURFACE B ➔ SURFACE A)
    // ==============================================================
    function syncCategoryVisibilityFromOwner() {
      const raw = localStorage.getItem('rm_active_categories_v1');
      let activeIds;
      if (!raw) {
        activeIds = new Set(RM_SERVICES_DATA.map(s => s.id).concat(RM_GAMES_DATA.map(g => g.id)));
      } else {
        try {
          activeIds = new Set(JSON.parse(raw));
          activeIds.add('c16');
          activeIds.add('16');
        } catch (_) {
          activeIds = new Set(RM_SERVICES_DATA.map(s => s.id).concat(RM_GAMES_DATA.map(g => g.id)));
        }
      }

      const t1List = document.getElementById('tier1-list');
      let liveT1 = 0;
      if (t1List) {
        Array.from(t1List.children).forEach(itemEl => {
          const catId = itemEl.dataset.catId;
          if (!catId) return;
          const num = catId.replace('c', '');
          const isLive = activeIds.has(catId) || activeIds.has(num);
          itemEl.style.display = isLive ? 'block' : 'none';
          if (isLive) liveT1++;
        });

        const t1Header = document.getElementById('tier1-header-text');
        if (t1Header) t1Header.textContent = `💼 आजीविका (${liveT1} सेवाएं उपलब्ध)`;
      }

      const t2List = document.getElementById('tier2-list');
      let liveT2 = 0;
      if (t2List) {
        Array.from(t2List.children).forEach(itemEl => {
          const catId = itemEl.dataset.catId;
          if (!catId) return;
          const num = catId.replace('g', '');
          const isLive = activeIds.has(catId) || activeIds.has(num);
          itemEl.style.display = isLive ? 'flex' : 'none';
          if (isLive) liveT2++;
        });

        const t2Header = document.getElementById('tier2-header-text');
        if (t2Header) t2Header.textContent = `🎮 खेल व मनोरंजन (${liveT2} श्रेणियां उपलब्ध)`;
      }

      const modalCount = document.getElementById('modal-catalog-count');
      if (modalCount) {
        modalCount.textContent = `${liveT1} Services • ${liveT2} Games Active`;
      }
    }

    function handleCategoryClick(catId, el) {
      if (catId === 'c16') {
        const sub = document.getElementById('sub-c16');
        if (sub) {
          const isHidden = sub.style.display === 'none';
          sub.style.display = isHidden ? 'block' : 'none';
        }
      } else if (catId === 'c05') {
        handleLaunchCategory('c05', '05-1');
      } else {
        alert(catId + ' सेवा का विस्तार जल्द उपलब्ध होगा।');
      }
    }

    function toggleAccordion(listId, btnEl) {
      renderCatalogItems();
      const list = document.getElementById(listId);
      if (!list) return;
      const isHidden = list.style.display === 'none';
      list.style.display = isHidden ? 'block' : 'none';
      const arrow = btnEl.querySelector('.acc-arrow');
      if (arrow) arrow.textContent = isHidden ? '▼' : '▶';
    }

    function toggleSubCategory(subListId, btnEl) {
      const list = document.getElementById(subListId);
      if (!list) return;
      const isHidden = list.style.display === 'none';
      list.style.display = isHidden ? 'block' : 'none';
      const arrow = btnEl.querySelector('.sub-arrow');
      if (arrow) arrow.textContent = isHidden ? '▼' : '▶';
    }

    function toggleMenuDrawer(show) {
      const modal = document.getElementById('categoryModal');
      if (show) {
        renderCatalogItems();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function openFullscreenModule(titleText) {
      const fsView = document.getElementById('rm-fullscreen-view');
      const titleEl = document.getElementById('fs-module-title');
      if (titleEl && titleText) titleEl.textContent = titleText;
      if (fsView) {
        fsView.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeFullscreenModule() {
      const fsView = document.getElementById('rm-fullscreen-view');
      if (fsView) {
        fsView.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    function handleLaunchCategory(catId, subId) {
      toggleMenuDrawer(false);
      const container = document.getElementById('rm-module-container');
      if (!container) return;

      if (catId === 'c16' && (subId === '16-2' || !subId)) {
        openFullscreenModule('🏠 16-2. किराया बहीखाता (Rental Ledger)');
        if (window.RM_Cat16_Sub2_RentalLedger) {
          window.RM_Cat16_Sub2_RentalLedger.mount(container);
        } else {
          container.innerHTML = '<div class="p-6 text-center text-xs text-emerald-400 animate-pulse">किराया बहीखाता लोड हो रहा है...</div>';
          const script = document.createElement('script');
          // EL-SYS-CACHE-BUSTER Compliant Dynamic Query Parameter
          script.src = '/js/catalog/category-16/16-2-rental-ledger.js?v=' + (window.RM_DEPLOY_EPOCH || Date.now());
          script.async = true;
          script.onload = function () {
            if (window.RM_Cat16_Sub2_RentalLedger) {
              window.RM_Cat16_Sub2_RentalLedger.mount(container);
            }
          };
          script.onerror = function () {
            container.innerHTML = '<div class="p-6 text-center text-xs text-red-400">किराया बहीखाता लोड नहीं हो सका। कृपया फाइल पाथ चेक करें।</div>';
          };
          document.body.appendChild(script);
        }
      } else if (catId === 'c05') {
        alert('सॉवरेन बहीखाता (Business Khata) लोड हो रहा है...');
      } else {
        alert('यह सेवा जल्द ही एक्टिवेट होगी।');
      }
    }

    function filterQuickTiles() {
      const q = (document.getElementById('liveSearchInput').value || '').toLowerCase().trim();
      const grid = document.getElementById('verticalTilesGrid');
      if (!grid) return;
      Array.from(grid.children).forEach(card => {
        const txt = card.innerText.toLowerCase();
        card.style.display = txt.includes(q) ? 'flex' : 'none';
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCatalogItems();
    });
    window.addEventListener('storage', syncCategoryVisibilityFromOwner);
  </script>
